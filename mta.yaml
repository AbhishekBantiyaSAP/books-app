_schema-version: 3.3.0
ID: bookshop-pipeline
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bookshop-pipeline-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookshop-pipeline-auth
      - name: bookshop-pipeline-db
      - name: bookshop-pipeline-destination

  - name: bookshop-pipeline-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookshop-pipeline-db
  - name: bookshop-pipeline
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: bookshop-pipeline-auth
      - name: bookshop-pipeline-html5-runtime
      - name: bookshop-pipeline-portal
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: bookshop-pipeline-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: bookshoppipelineadminauthors
          artifacts:
            - admin-authors.zip
          target-path: app/
        - name: bookshoppipelineadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: bookshoppipelinebrowse
          artifacts:
            - browse.zip
          target-path: app/
        - name: bookshoppipelinegenres
          artifacts:
            - genres.zip
          target-path: app/
    requires:
      - name: bookshop-pipeline-auth
      - name: srv-api
      - name: bookshop-pipeline-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: bookshoppipelineadminauthors
    type: html5
    path: app/admin-authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshoppipelineadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshoppipelinebrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshoppipelinegenres
    type: html5
    path: app/genres
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: bookshop-pipeline-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      - name: bookshop-pipeline-portal
        parameters:
          content-target: true
          service-key:
            name: bookshop-pipeline-portal-key
            config:
              content-endpoint: developer
      - name: bookshop-pipeline-auth
      - name: bookshop-pipeline-html5-repo-host
      - name: bookshop-pipeline-app-deployer
    deployed-after:
      - bookshop-pipeline-app-deployer

resources:
  - name: bookshop-pipeline-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bookshop-pipeline-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'admin (bookshop-pipeline ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api
  - name: bookshop-pipeline-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-pipeline-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: bookshop-pipeline-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: bookshop-pipeline-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: bookshop-pipeline-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: portal
      service-plan: standard
